<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - MultasClear</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .signup-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .btn-hover:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="signup-bg">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden">
            <div class="p-8">
                <div class="text-center mb-8">
                    <div class="w-20 h-20 bg-green-500 rounded-full flex items-center justify-center mb-4 mx-auto shadow-lg">
                        <i class="fas fa-user-plus text-white text-2xl"></i>
                    </div>
                    <h2 class="text-3xl font-bold text-gray-900">Crear Cuenta</h2>
                    <p class="text-gray-600 mt-2">Únete a MultasClear</p>
                </div>

                <form class="space-y-6">
                    <div>
                        <label class="block text-gray-700 text-sm font-semibold mb-2">Nombre Completo</label>
                        <input type="text" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200" placeholder="Ingresa tu nombre completo" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-semibold mb-2">Email</label>
                        <input type="email" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200" placeholder="tu@email.com" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-semibold mb-2">Usuario</label>
                        <input type="text" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200" placeholder="Crea tu nombre de usuario" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-semibold mb-2">Contraseña</label>
                        <input type="password" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200" placeholder="Crea una contraseña segura" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-semibold mb-2">Confirmar Contraseña</label>
                        <input type="password" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200" placeholder="Repite tu contraseña" required>
                    </div>
                    
                    <button type="button" onclick="signup()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-blue-700 transition duration-300 shadow-lg btn-hover">
                        Crear Cuenta
                    </button>
                </form>
                
                <div class="text-center mt-8 pt-6 border-t border-gray-200">
                    <p class="text-gray-600">¿Ya tienes una cuenta?</p>
                    <a href="login.html" class="text-blue-600 font-semibold hover:text-blue-800 transition duration-200 inline-block mt-2">
                        Inicia Sesión aquí
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function signup() {
            alert('Cuenta creada exitosamente - Redirigiendo al inicio...');
            // Aquí iría la lógica real de registro
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        }
    </script>
</body>
</html>
