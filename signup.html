<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - MultasClear</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e3f2fd 0%, #fce4ec 100%);
            color: #333;
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #1e3a8a 0%, #dc2626 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(30, 58, 138, 0.4);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(220, 38, 38, 0.6);
        }
        
        .message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 4px;
            text-align: center;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- HEADER -->
    <header class="glass-card shadow-lg py-4 px-6 flex justify-between items-center sticky top-0 z-10 mx-6 mt-4">
        <div class="flex items-center">
            <div class="w-12 h-12 bg-gradient-to-r from-blue-800 to-red-600 rounded-xl flex items-center justify-center mr-3 shadow-md">
                <i class="fas fa-gavel text-white text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-800 to-red-600 bg-clip-text text-transparent">MultasClear</h1>
        </div>
        <nav class="space-x-4">
            <a href="index.html" class="text-blue-800 font-medium hover:text-red-600 transition duration-300">Inicio</a>
            <a href="login.html" class="text-blue-800 font-medium hover:text-red-600 transition duration-300">Iniciar Sesión</a>
        </nav>
    </header>

    <!-- SIGNUP SECTION -->
    <main class="flex-grow flex items-center justify-center py-12 px-4">
        <div class="glass-card p-8 w-full max-w-md">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800 mb-2">Crear Cuenta</h2>
                <p class="text-gray-600">Regístrate para comenzar a gestionar tus multas</p>
            </div>
            
            <form id="signupForm">
                <div class="mb-4">
                    <label for="name" class="block text-gray-700 font-medium mb-2">Nombre Completo</label>
                    <input type="text" id="name" name="name" required 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div class="mb-4">
                    <label for="email" class="block text-gray-700 font-medium mb-2">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div class="mb-4">
                    <label for="password" class="block text-gray-700 font-medium mb-2">Contraseña</label>
                    <input type="password" id="password" name="password" required 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div class="mb-6">
                    <label for="confirmPassword" class="block text-gray-700 font-medium mb-2">Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <button type="submit" class="btn-primary w-full py-3 rounded-lg font-medium text-lg mb-4">
                    Registrarse
                </button>
            </form>
            
            <div id="message" class="message"></div>
            
            <div class="text-center mt-6">
                <p class="text-gray-600">¿Ya tienes una cuenta? 
                    <a href="login.html" class="text-blue-600 font-medium hover:text-red-600 transition">Inicia sesión aquí</a>
                </p>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-gradient-to-r from-gray-800 to-gray-900 text-white py-8 px-6">
        <div class="max-w-6xl mx-auto text-center">
            <p>&copy; 2023 MultasClear. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script>
        // Función para mostrar mensajes
        function showMessage(message, type = 'error') {
            const messageDiv = document.getElementById('message');
            if (messageDiv) {
                messageDiv.textContent = message;
                messageDiv.className = `message ${type}`;
                setTimeout(() => {
                    messageDiv.textContent = '';
                    messageDiv.className = 'message';
                }, 5000);
            }
        }

        // Signup Form
        const signupForm = document.getElementById('signupForm');
        if (signupForm) {
            signupForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                
                // Validaciones
                if (!name || !email || !password || !confirmPassword) {
                    showMessage('Por favor, completa todos los campos');
                    return;
                }
                
                if (password !== confirmPassword) {
                    showMessage('Las contraseñas no coinciden');
                    return;
                }
                
                if (password.length < 6) {
                    showMessage('La contraseña debe tener al menos 6 caracteres');
                    return;
                }
                
                // Obtener usuarios del localStorage
                const users = JSON.parse(localStorage.getItem('users')) || [];
                
                // Verificar si el usuario ya existe
                if (users.find(u => u.email === email)) {
                    showMessage('Este email ya está registrado');
                    return;
                }
                
                // Crear nuevo usuario
                const newUser = {
                    id: Date.now(),
                    name,
                    email,
                    password,
                    registrationDate: new Date().toLocaleDateString()
                };
                
                // Guardar usuario
                users.push(newUser);
                localStorage.setItem('users', JSON.stringify(users));
                
                showMessage('Registro exitoso. Redirigiendo al login...', 'success');
                
                // Redirigir después de un breve delay
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            });
        }

        // Verificar si ya está logueado
        const currentUser = localStorage.getItem('currentUser');
        if (currentUser) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
