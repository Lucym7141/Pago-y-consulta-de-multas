{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MultaPay</title>
    <!-- bootstrap CDN opcional (tu HTML la usaba) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
    <header class="app-header">
        <div class="d-flex justify-content-between align-items-center">
            <a href="{% url 'consulta' %}" class="navbar-brand d-flex align-items-center gap-2">
                <img src="{% static 'multaApp/img/logo.png' %}" 
                    width="32" height="32" 
                    alt="logo" 
                    style="object-fit:contain;">
                <span>MultaPay</span>
            </a>

            <div class="status-summary d-flex align-items-center">
                <!-- BOTÓN PORTAL PÚBLICO -->
<a href="{% url 'consulta' %}"
   class="btn selector-btn px-4 py-2
          {% if request.resolver_match.url_name == 'consulta' %}active-option{% endif %}">
   🌐 Portal Público
</a>

<!-- BOTÓN HISTORIAL / DASHBOARD -->
<a href="{% url 'dashboard' %}"
   class="btn selector-btn px-4 py-2
          {% if request.resolver_match.url_name == 'dashboard' %}active-option{% endif %}">
   📊 Historial
</a>
            </div>
        </div>
    </header>

    <main class="main-container">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        <p class="mb-1">© 2025 MultaPay. Todos los derechos reservados.</p>
        <p>Si necesitas ayuda, contáctanos: <a href="mailto:soporte@multapay.co">soporte@multapay.co</a></p>
    </footer>
</body>
</html>
