{% extends "base.html" %}
{% load static %}
{% block content %}

<div class="container" style="max-width:500px; margin-top:5rem;">
    
    <div class="card shadow-lg border-0" style="border-radius:15px;">
        <div class="card-body p-5">
            
            <!-- Logo/Header -->
            <div class="text-center mb-4">
                <div class="mb-3">
                    <span style="font-size:4rem;">🔐</span>
                </div>
                <h2 class="fw-bold">Iniciar Sesión</h2>
                <p class="text-muted">Accede a tu cuenta de MultaPay</p>
            </div>

            <!-- Mensajes -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <!-- Formulario -->
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Usuario o Email</label>
                    <input type="text" name="username" class="form-control form-control-lg" 
                           placeholder="Ingresa tu usuario" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Contraseña</label>
                    <input type="password" name="password" class="form-control form-control-lg" 
                           placeholder="Ingresa tu contraseña" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                    Iniciar Sesión
                </button>

                <div class="text-center">
                    <p class="text-muted mb-2">¿No tienes una cuenta?</p>
                    <a href="{% url 'signup' %}" class="btn btn-outline-primary w-100">
                        Crear Cuenta Nueva
                    </a>
                </div>

                <hr class="my-4">

                <div class="text-center">
                    <a href="{% url 'home' %}" class="text-muted">← Volver al inicio</a>
                </div>
            </form>

        </div>
    </div>

</div>

{% endblock %}
